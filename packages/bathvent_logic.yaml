# =============================================================================
# bathvent_logic.yaml — Hardware-independent control logic
# =============================================================================

# ---- Persistent state (restored across reboots) ----
# The remaining controller state (levels, timers) lives as statics inside
# bathvent_tick() in bathvent.cpp.

globals:
  - id: humidity_ema
    type: float
    restore_value: true
    initial_value: '50.0'

# ---- Sensors (DHT20 + SGP40) ----

sensor:
  - platform: aht10
    variant: AHT20
    update_interval: 5s
    temperature:
      name: "Temperature"
      id: dht20_temperature
    humidity:
      name: "Humidity"
      id: dht20_humidity

  - platform: sgp4x
    update_interval: 5s
    store_baseline: true
    voc:
      name: "VOC Index"
      id: voc_index
    compensation:
      temperature_source: dht20_temperature
      humidity_source: dht20_humidity

# ---- Template sensors for derived values ----
# Publish-only sinks: fed every second from the interval lambda below.
# (Own lambdas were removed to avoid dead/duplicated logic.)

  - platform: template
    name: "Humidity Baseline"
    id: humidity_baseline
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    name: "Humidity Delta"
    id: humidity_delta
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    name: "VOC Status"
    id: voc_state_sensor
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Humidity Status"
    id: humidity_state_sensor
    accuracy_decimals: 0
    update_interval: never

# ---- Binary sensors ----

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO13
      mode: INPUT
      inverted: true
    name: "Light Switch"
    id: light_switch
    filters:
      - delayed_off: 100ms

  - platform: template
    name: "DHT20 Status"
    id: dht20_status
    lambda: |-
      return !isnan(id(dht20_humidity).state);

  - platform: template
    name: "SGP40 Status"
    id: sgp40_status
    lambda: |-
      return !isnan(id(voc_index).state);

# ---- Text sensors for diagnostics (stage / reason) ----
# Values are published every second from the single decision point in the
# interval lambda below; these are publish-only sinks (no own lambda).

text_sensor:
  - platform: template
    name: "Stage"
    id: stage
    update_interval: never

  - platform: template
    name: "Reason"
    id: reason
    update_interval: never

# ---- Relay outputs (cascade) ----
# Kaskade: Master (Ein/Aus), Full (Voll/Reduziert), LowMid (Low/Mid).
# Gelötete Verdrahtung: Full NC = voll (direkt via NTC), Full NO = reduziert
# (Kondensator-Bank); LowMid NO = 6uF (mid), LowMid NC = 4uF (low).
# De-energized Master = Motor aus (sicherer Boot-Zustand).

switch:
  - platform: gpio
    pin: GPIO14
    id: relay_master
    name: "Relay Master"
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    pin: GPIO16
    id: relay_lowmid
    name: "Relay LowMid"
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    pin: GPIO12
    id: relay_full
    name: "Relay Full"
    restore_mode: RESTORE_DEFAULT_OFF

# ---- Adjustable parameters via MQTT ----

number:
  - platform: template
    name: "Humidity Threshold"
    id: humidity_threshold
    optimistic: true
    min_value: 1
    max_value: 30
    step: 1
    restore_value: true
    initial_value: 10
    unit_of_measurement: "%"
    mode: BOX

  - platform: template
    name: "VOC Threshold"
    id: voc_threshold
    optimistic: true
    min_value: 101
    max_value: 400
    step: 5
    restore_value: true
    initial_value: 150
    mode: BOX

  - platform: template
    name: "Humidity Hysteresis"
    id: humidity_hysteresis
    optimistic: true
    min_value: 1
    max_value: 10
    step: 1
    restore_value: true
    initial_value: 3
    unit_of_measurement: "%"
    mode: BOX

  - platform: template
    name: "VOC Hysteresis"
    id: voc_hysteresis
    optimistic: true
    min_value: 1
    max_value: 50
    step: 1
    restore_value: true
    initial_value: 10
    mode: BOX

  - platform: template
    name: "Humidity EMA Alpha"
    id: humidity_ema_alpha
    optimistic: true
    min_value: 0.00001
    max_value: 0.01
    step: 0.0001
    restore_value: true
    initial_value: 0.0005
    mode: BOX

  - platform: template
    name: "Sniff Interval"
    id: sniff_interval
    optimistic: true
    min_value: 300
    max_value: 7200
    step: 60
    restore_value: true
    initial_value: 1800
    unit_of_measurement: "s"
    mode: BOX

  - platform: template
    name: "Afterrun Duration"
    id: afterrun_duration
    optimistic: true
    min_value: 10
    max_value: 300
    step: 10
    restore_value: true
    initial_value: 60
    unit_of_measurement: "s"
    mode: BOX

# ---- Mode override via MQTT ----

select:
  - platform: template
    name: "Operation Mode"
    id: operation_mode
    optimistic: true
    restore_value: true
    initial_option: "AUTO"
    options:
      - "AUTO"
      - "OFF"
      - "LOW"
      - "MID"
      - "FULL"

# ---- Control loop: 1-second state machine tick ----
# The actual state machine lives in bathvent_tick() in bathvent.h / .cpp.
# This lambda only wires the ESPHome entities to that function (I/O stays
# here because the id() helper is only available inside lambdas).

interval:
  - interval: 1s
    then:
      - lambda: |-
          // Build the tuning config from the adjustable MQTT parameters.
          BathventConfig config;
          config.humidity_threshold = id(humidity_threshold).state;
          config.humidity_hysteresis = id(humidity_hysteresis).state;
          config.voc_threshold = id(voc_threshold).state;
          config.voc_hysteresis = id(voc_hysteresis).state;
          config.ema_alpha = id(humidity_ema_alpha).state;
          config.afterrun_duration_s = static_cast<int>(id(afterrun_duration).state);
          config.sniff_interval_s = static_cast<int>(id(sniff_interval).state);

          // Gather the per-tick sensor inputs.
          BathventInputs inputs;
          inputs.humidity = id(dht20_humidity).state;
          inputs.voc = id(voc_index).state;
          inputs.light = id(light_switch).state;
          inputs.mode = parse_op_mode(id(operation_mode).current_option().c_str());

          // Run one control tick. The EMA baseline is kept as a restore-able
          // ESPHome global and passed in/out so it survives reboots.
          BathventResult result = bathvent_tick(inputs, config, id(humidity_ema));

          // Publish derived measurement sensors (publish-only sinks).
          if (result.humidity_ok) {
            id(humidity_baseline).publish_state(result.baseline);
          }
          id(humidity_delta).publish_state(result.delta);
          id(humidity_state_sensor).publish_state(result.hum_level);
          id(voc_state_sensor).publish_state(result.voc_level);

          // Apply relays (cascade): master on/off, full routes LOW/MID through the
          // capacitor bank (Full NO) and FULL direct through the NTC (Full NC),
          // lowmid selects 4uF (NC) / 6uF (NO). Motor off unless master is on.
          id(relay_master).turn_off();
          id(relay_lowmid).turn_off();
          id(relay_full).turn_off();
          if (result.stage != Stage::kOff) {
            id(relay_master).turn_on();  // motor connected
          }
          if (result.stage == Stage::kLow || result.stage == Stage::kMid) {
            id(relay_full).turn_on();    // LOW/MID: through capacitor bank (Full NO)
          }
          if (result.stage == Stage::kMid) {
            id(relay_lowmid).turn_on();  // MID: 6uF (LowMid NO)
          }
          // FULL: only master on -> direct via NTC (Full NC)

          // Publish diagnostics (single source of truth).
          id(stage).publish_state(stage_name(result.stage));
          id(reason).publish_state(result.reason);
