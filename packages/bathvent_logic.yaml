# =============================================================================
# bathvent_logic.yaml — Hardware-independent control logic
# =============================================================================
# The controller is a small state machine implemented in bathvent.h/.cpp and
# described in docs/state-machine.md. All state persisted between ticks lives
# as a module global inside bathvent.cpp — ESPHome globals are no longer used.
#
# Every parameter is an MQTT "number" entity (settable, restore_value: true),
# and everything the controller keeps between ticks is published for insight.

# ---- Sensors (DHT20 + SGP40) ----

sensor:
  - platform: aht10
    variant: AHT20
    update_interval: 5s
    temperature:
      name: "Temperature"
      id: dht20_temperature
    humidity:
      name: "Humidity"
      id: dht20_humidity

  - platform: sgp4x
    update_interval: 5s
    store_baseline: true
    voc_index:
      name: "VOC Index"
      id: voc_index
    compensation:
      temperature_source: dht20_temperature
      humidity_source: dht20_humidity

# ---- State mirrors ----
# Everything the controller keeps between ticks is published from the interval
# lambda below: the change-check reference values and the age of each timestamp
# (which drives max_off_time, flush_duration, afterrun_duration and the check).

  - platform: template
    name: "Stored Humidity"
    id: stored_humidity
    unit_of_measurement: "%"
    accuracy_decimals: 2
    update_interval: never

  - platform: template
    name: "Stored VOC Index"
    id: stored_voc
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Last Sensor Check Age"
    id: last_sensor_check_age
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Last On Age"
    id: last_on_age
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Afterrun Age"
    id: afterrun_age
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: "Flush Age"
    id: flush_age
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: never

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO13
      mode: INPUT
      inverted: true
    name: "Light Switch"
    id: light_switch
    filters:
      - delayed_off: 100ms

# ---- Text sensors (state + trace) ----
# Publish-only sinks, refreshed every tick from the interval lambda below.
# "Trace" is the short per-tick trace; the full form goes to the log.

text_sensor:
  - platform: template
    name: "Fan State"
    id: fan_state
    update_interval: never

  - platform: template
    name: "Stage"
    id: stage
    update_interval: never

  - platform: template
    name: "Trace"
    id: trace
    update_interval: never

# ---- Relay outputs (cascade) ----
# Kaskade: Master (Ein/Aus), Full (Voll/Reduziert), LowMid (Low/Mid).
# Gelötete Verdrahtung: Full NC = voll (direkt via NTC), Full NO = reduziert
# (Kondensator-Bank); LowMid NO = 5uF (mid), LowMid NC = 3uF (low).
# De-energized Master = Motor aus (sicherer Boot-Zustand).

switch:
  - platform: gpio
    pin: GPIO14
    id: relay_master
    name: "Relay Master"
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    pin: GPIO16
    id: relay_lowmid
    name: "Relay LowMid"
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    pin: GPIO12
    id: relay_full
    name: "Relay Full"
    restore_mode: RESTORE_DEFAULT_OFF

# ---- Configurable parameters via MQTT ----
# The compiled defaults live in BathventConfig (bathvent.h) and the
# initial_value here must match. restore_value keeps the tuning across
# reboots — a stored value always wins over a changed default after flashing
# (set it once via MQTT or wipe the flash).

number:
  # A humidity reading above this is "elevated" (absolute, not a delta).
  - platform: template
    name: "Humidity Threshold"
    id: humidity_threshold
    optimistic: true
    min_value: 30
    max_value: 90
    step: 1
    restore_value: true
    initial_value: 65
    unit_of_measurement: "%"
    mode: BOX

  - platform: template
    name: "VOC Threshold"
    id: voc_threshold
    optimistic: true
    min_value: 101
    max_value: 400
    step: 5
    restore_value: true
    initial_value: 150
    mode: BOX

  # A run keeps going as long as ANY control sensor moved more than its own
  # change threshold within one check interval.
  - platform: template
    name: "Humidity Change Threshold"
    id: humidity_change_threshold
    optimistic: true
    min_value: 0.1
    max_value: 5
    step: 0.1
    restore_value: true
    initial_value: 1.0
    unit_of_measurement: "%"
    mode: BOX

  - platform: template
    name: "VOC Change Threshold"
    id: voc_change_threshold
    optimistic: true
    min_value: 1
    max_value: 50
    step: 1
    restore_value: true
    initial_value: 10
    mode: BOX

  # Doubles as the minimum run time and as the debounce of the change check.
  - platform: template
    name: "Change Check Interval"
    id: change_check_interval
    optimistic: true
    min_value: 60
    max_value: 900
    step: 30
    restore_value: true
    initial_value: 300
    unit_of_measurement: "s"
    mode: BOX

  # Idle time before the periodic air exchange (flush) while absent.
  - platform: template
    name: "Max Off Time"
    id: max_off_time
    optimistic: true
    min_value: 300
    max_value: 7200
    step: 60
    restore_value: true
    initial_value: 1800
    unit_of_measurement: "s"
    mode: BOX

  # Duct flush before a reading may be trusted.
  - platform: template
    name: "Flush Duration"
    id: flush_duration
    optimistic: true
    min_value: 15
    max_value: 120
    step: 5
    restore_value: true
    initial_value: 30
    unit_of_measurement: "s"
    mode: BOX

  # LOW window after the presence ends (only ever entered from the sniff state).
  - platform: template
    name: "Afterrun Duration"
    id: afterrun_duration
    optimistic: true
    min_value: 60
    max_value: 600
    step: 10
    restore_value: true
    initial_value: 300
    unit_of_measurement: "s"
    mode: BOX

  # Fail-safe policy: the value used instead of a NAN reading. Humidity above
  # its threshold means a dead sensor ventilates; VOC below means a missing
  # SGP40 is simply ignored.
  - platform: template
    name: "Humidity NaN Value"
    id: humidity_nan_value
    optimistic: true
    min_value: 0
    max_value: 200
    step: 1
    restore_value: true
    initial_value: 101
    mode: BOX

  - platform: template
    name: "VOC NaN Value"
    id: voc_nan_value
    optimistic: true
    min_value: 0
    max_value: 500
    step: 1
    restore_value: true
    initial_value: 0
    mode: BOX

# ---- Control loop: 1-second state machine tick ----
# The state machine lives in bathvent_tick() (bathvent.h / .cpp); this lambda
# only wires the ESPHome entities to it (I/O stays here because the id() helper
# is only available inside lambdas).

interval:
  - interval: 1s
    then:
      - lambda: |-
          // Tuning from the MQTT number entities.
          BathventConfig config;
          config.humidity_threshold = id(humidity_threshold).state;
          config.voc_threshold = id(voc_threshold).state;
          config.humidity_change_threshold = id(humidity_change_threshold).state;
          config.voc_change_threshold = id(voc_change_threshold).state;
          config.change_check_interval_s = static_cast<int>(id(change_check_interval).state);
          config.max_off_time_s = static_cast<int>(id(max_off_time).state);
          config.flush_duration_s = static_cast<int>(id(flush_duration).state);
          config.afterrun_duration_s = static_cast<int>(id(afterrun_duration).state);
          config.humidity_nan_value = id(humidity_nan_value).state;
          config.voc_nan_value = id(voc_nan_value).state;

          // Per-tick inputs.
          BathventInputs inputs;
          inputs.humidity = id(dht20_humidity).state;
          inputs.voc = id(voc_index).state;
          inputs.light = id(light_switch).state;
          inputs.now_s = millis() / 1000;

          const BathventResult result = bathvent_tick(inputs, config);

          // Apply the relays (cascade): master on/off; full routes LOW/MID
          // through the capacitor bank (Full NO) and FULL direct through the NTC
          // (Full NC); lowmid selects 3uF (NC) / 5uF (NO).
          id(relay_master).turn_off();
          id(relay_lowmid).turn_off();
          id(relay_full).turn_off();
          if (result.stage != Stage::kOff) {
            id(relay_master).turn_on();  // motor connected
          }
          if (result.stage == Stage::kLow || result.stage == Stage::kMid) {
            id(relay_full).turn_on();    // LOW/MID: via capacitor bank (Full NO)
          }
          if (result.stage == Stage::kMid) {
            id(relay_lowmid).turn_on();  // MID: 5uF (LowMid NO)
          }
          // FULL: only master on -> direct via NTC (Full NC)

          // Publish the state. Everything the controller keeps between ticks is
          // visible: state, stage, the short trace, the change-check reference
          // values and the age of each timestamp.
          id(fan_state).publish_state(state_name(result.state));
          id(stage).publish_state(stage_name(result.stage));
          id(trace).publish_state(result.trace);
          id(last_sensor_check_age).publish_state(result.since_sensor_check_s);
          id(last_on_age).publish_state(result.since_last_on_s);
          id(afterrun_age).publish_state(result.since_afterrun_s);
          id(flush_age).publish_state(result.since_flush_s);
          if (!std::isnan(result.stored_humidity)) {
            id(stored_humidity).publish_state(result.stored_humidity);
          }
          if (!std::isnan(result.stored_voc)) {
            id(stored_voc).publish_state(result.stored_voc);
          }
